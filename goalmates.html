<script>

let GROUP_CONFIG = null;
let CURRENT_USER = null;
let PLAYERS = [];
const PLAYER_PHOTOS = {};
const KEY="torneos_pes_final_v3";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||seed();
state=(typeof normalizeStateShape==='function'?normalizeStateShape(state):state);
let ui={tab:"home",selectedTournament:state.tournaments[0]?.id||null,newName:"2vs2 Viernes",mode:"2v2",format:"Liga",selected:[...PLAYERS],preview:null,hType:"players",hA:PLAYERS[0]||"",hB:PLAYERS[1]||"",tA:(PLAYERS[0]&&PLAYERS[1])?PLAYERS[0]+" + "+PLAYERS[1]:"",tB:(PLAYERS[2]&&PLAYERS[3])?PLAYERS[2]+" + "+PLAYERS[3]:"",legMode:"Ida",copaLegs:"Ida",histScope:"General",hFormat:"Todos"};

const firebaseConfig = {
  apiKey: "AIzaSyAgLQSXSHvjN38Cij-8TTfPkmSh1Sg3zaw",
  authDomain: "torneo-pes.firebaseapp.com",
  databaseURL: "https://torneo-pes-default-rtdb.firebaseio.com",
  projectId: "torneo-pes",
  storageBucket: "torneo-pes.firebasestorage.app",
  messagingSenderId: "1057254488242",
  appId: "1:1057254488242:web:2a45d92b023ddd191a71ab",
  measurementId: "G-KB4SR079ZR"
};
let db=null;
let syncingFromCloud=false;
const let DB_PATH = "torneosApp/state";;
let pendingDeletedTournamentIds=new Set();

function seed(){return{tournaments:[],matches:[],deletedTournamentIds:[]}}
function normalizeStateShape(data){
  const safe=data && typeof data==='object' ? data : {};
  const deleted=(safe.deletedTournamentIds||[]).map(String);
  const deletedSet=new Set(deleted);
  return {
    tournaments:(Array.isArray(safe.tournaments)?safe.tournaments:[]).filter(t=>!deletedSet.has(String(t.id))),
    matches:(Array.isArray(safe.matches)?safe.matches:[]).filter(m=>!deletedSet.has(String(m.tournamentId))),
    deletedTournamentIds:deleted
  };
}
function save(){
  state=normalizeStateShape(state);
  localStorage.setItem(KEY,JSON.stringify(state));
  if(db && !syncingFromCloud){
    db.ref(DB_PATH).set(state).catch(err=>console.warn("No se pudo guardar en Firebase", err));
  }
}
function $(id){return document.getElementById(id)}
function esc(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function pairs(arr){let out=[];for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)out.push([arr[i],arr[j]]);return out}
function makeTeams(players){let s=shuffle(players), out=[];for(let i=0;i<s.length;i+=2) if(s[i+1]) out.push([s[i],s[i+1]]); return out}
function unitsFor(mode,players){return mode==="1v1"?players.map(p=>[p]):makeTeams(players)}
function selectedSignature(players){return [...(players||[])].map(String).sort().join("|")}
function cloneUnits(units){return (units||[]).map(u=>Array.isArray(u)?[...u]:[u])}
function teamName(t){return Array.isArray(t)?t.join(" + "):String(t||"")}
function playerPhoto(name,cls="photoMini"){return `<span class="avatar">${esc(String(name||"?")[0]||"?")}</span>`}
function playerInline(name,cls="photoMini"){return `<span class="teamPhotos"><span class="photoStack">${playerPhoto(name,cls)}</span><span class="names">${esc(name)}</span></span>`}
function teamHtml(team,align="left",photoCls="photoMini"){if(!Array.isArray(team))return esc(teamName(team));if(isPlaceholder(team))return `<span class="teamPhotos ${align==='right'?'right':''}"><span class="names">${esc(teamName(team))}</span></span>`;let photos=team.map(p=>playerPhoto(p,photoCls)).join("");let names=esc(teamName(team));return `<span class="teamPhotos ${align==='right'?'right':''}"><span class="photoStack">${photos}</span><span class="names">${names}</span></span>`}
function teamFromNameHtml(name,align="left",photoCls="photoMini"){let parts=String(name||"").split(" + ").map(x=>x.trim()).filter(Boolean);return teamHtml(parts.length?parts:[name],align,photoCls)}
function sortPhotos(players){return `<div class="sortPhotos">${players.map(p=>`<div style="text-align:center">${playerPhoto(p,"photoBig")}<div class="whiteMuted" style="margin-top:4px">${esc(p)}</div></div>`).join("")}</div>`}
function unitKey(u){return teamName(u)}
function isPlaceholder(team){return Array.isArray(team)&&(String(team[0]||"").startsWith("Ganador ")||String(team[0]||"")==="Pase libre")}
function teamReady(team){return Array.isArray(team)&&team.length&&!isPlaceholder(team)}
function byeWinnerTeam(m){
  if(!m||!m.bye)return [];
  if(teamReady(m.teamA))return m.teamA;
  if(teamReady(m.teamB))return m.teamB;
  return [];
}
function isResolvedBye(m){return Boolean(m&&m.bye&&teamReady(byeWinnerTeam(m)))}
function isVisibleBye(m){return Boolean(m&&m.bye)}
function visibleCupMatches(ms,st){return ms.filter(m=>m.stage===st&&(!m.bye||isVisibleBye(m)))}
function byeDisplayTeam(m){
  if(!m||!m.bye)return [];
  if(teamReady(m.teamA))return m.teamA;
  if(teamReady(m.teamB))return m.teamB;
  if(Array.isArray(m.teamA)&&m.teamA.length)return m.teamA;
  if(Array.isArray(m.teamB)&&m.teamB.length)return m.teamB;
  return ['Por definir'];
}
function byeStatusText(m){
  if(!m||!m.bye)return '';
  if(isResolvedBye(m))return 'Pase libre: avanza';
  return 'Pase libre pendiente: se completa con el ganador anterior';
}
function selectedTournament(){return state.tournaments.find(t=>t.id==ui.selectedTournament)||state.tournaments[0]||null}
function todayISO(){return new Date().toISOString().slice(0,10)}
function dateLabel(iso){if(!iso)return '';let [y,m,d]=String(iso).slice(0,10).split('-');if(!y||!m||!d)return String(iso);return `${d}/${m}/${y}`}
function tournamentLegMode(t){return (t?.legMode||t?.copaLegs||'Ida')==='Ida y vuelta'?'Ida y vuelta':'Ida'}
function tournamentSmallMeta(t){return `${esc(t.mode)} · ${esc(t.format)} · ${esc(tournamentLegMode(t))} · ${dateLabel(t.createdAt||t.date||'')}`}
function tournamentDateText(t){return `Creado: ${dateLabel(t.createdAt||t.date||'')} · ${esc(t.mode)} · ${esc(t.format)} · ${esc(tournamentLegMode(t))}`}
function newMatchId(t,counter){return (Number(t.id)%9000000000000)*1000+counter}
function nextPowerOfTwo(n){let p=1;while(p<n)p*=2;return p}
function stageForSlots(slots){return slots>8?`Ronda de ${slots}`:slots===8?"Cuartos":slots===4?"Semifinal":slots===2?"Final":"Final"}
function stageSlots(stage){if(stage==="Final")return 2;if(stage==="Semifinal")return 4;if(stage==="Cuartos")return 8;if(stage&&stage.startsWith("Ronda de "))return Number(stage.replace("Ronda de ",""));return 9999}
function stageOrder(ms){return [...new Set(ms.map(m=>m.stage))].sort((a,b)=>stageSlots(b)-stageSlots(a))}
function matchLegMode(m){if(!m||m.format!=="Copa")return "Ida"; if((m.stage||m.round)==="Final")return "Ida"; return (m.legMode||m.copaLegs)==="Ida y vuelta"?"Ida y vuelta":"Ida"}
function aggregateScore(m){
  let a=Number(m.scoreA||0), b=Number(m.scoreB||0);
  if(matchLegMode(m)==="Ida y vuelta"){
    a+=Number(m.scoreB2||0);
    b+=Number(m.scoreA2||0);
  }
  return {a,b};
}
function winnerOf(m){
  if(!m.played||m.bye)return null;
  let agg=aggregateScore(m), a=agg.a, b=agg.b;
  if(a>b)return m.teamA;
  if(b>a)return m.teamB;
  if(m.format==="Copa"){
    let pa=Number(m.penA), pb=Number(m.penB);
    if(!Number.isNaN(pa)&&!Number.isNaN(pb)&&pa!==pb)return pa>pb?m.teamA:m.teamB;
  }
  return null;
}
function scoreText(m){
  if(!m.played)return 'vs';
  if(matchLegMode(m)==="Ida y vuelta"){
    let agg=aggregateScore(m);
    let base=`Ida ${m.scoreA}-${m.scoreB} · Vuelta ${m.scoreA2}-${m.scoreB2} · Global ${agg.a}-${agg.b}`;
    if(m.format==="Copa"&&agg.a===agg.b&&m.penA!==undefined&&m.penA!==""&&m.penB!==undefined&&m.penB!=="")return `${base} · pen ${m.penA}-${m.penB}`;
    return base;
  }
  let base=`${m.scoreA} - ${m.scoreB}`;
  if(m.format==="Copa"&&Number(m.scoreA)===Number(m.scoreB)&&m.penA!==undefined&&m.penA!==""&&m.penB!==undefined&&m.penB!=="")return `${base} · pen ${m.penA}-${m.penB}`;
  return base;
}

function optimizeOrder(units, rawPairs){
  let remaining=[...rawPairs];
  let idle={}; units.forEach(u=>idle[unitKey(u)]=99);
  let lastKeys=[];
  let ordered=[];
  while(remaining.length){
    remaining.sort((a,b)=>{
      const ak=a.map(unitKey), bk=b.map(unitKey);
      const aWait=ak.reduce((n,k)=>n+(idle[k]||0),0);
      const bWait=bk.reduce((n,k)=>n+(idle[k]||0),0);
      const aRepeat=ak.some(k=>lastKeys.includes(k))?1:0;
      const bRepeat=bk.some(k=>lastKeys.includes(k))?1:0;
      return (bWait-bRepeat*80)-(aWait-aRepeat*80);
    });
    let next=remaining.shift(); ordered.push(next);
    let playing=next.map(unitKey);
    Object.keys(idle).forEach(k=>idle[k]=playing.includes(k)?0:idle[k]+1);
    lastKeys=playing;
  }
  return ordered;
}

function baseMatch(t,a,b,round,stage,i,legLabel='') {return{id:Date.now()+Math.floor(Math.random()*100000)+i,tournamentId:t.id,tournamentName:t.name,mode:t.mode,format:t.format,legMode:t.legMode||t.copaLegs||"Ida",copaLegs:t.copaLegs||t.legMode||"Ida",round,stage,legLabel,teamA:a,teamB:b,scoreA:"",scoreB:"",scoreA2:"",scoreB2:"",played:false,date:""}}
function generateMatches(t){
  // Importante: si el torneo ya trae equipos sorteados, el fixture debe usar ESOS mismos equipos.
  // No se vuelve a sortear acá, porque si no cambian las duplas entre la vista previa y el fixture.
  let units=(Array.isArray(t.teams)&&t.teams.length)?cloneUnits(t.teams):unitsFor(t.mode,t.players);
  if(t.format==="Copa") return generateCopaBracket(t,units);
  let ordered=optimizeOrder(units,pairs(units));
  let out=[];
  ordered.forEach((p,i)=>out.push(baseMatch(t,p[0],p[1],`Fecha ${out.length+1}`,"Liga",out.length+1,"Ida")));
  if(tournamentLegMode(t)==="Ida y vuelta"){
    ordered.forEach((p,i)=>out.push(baseMatch(t,p[1],p[0],`Fecha ${out.length+1}`,"Liga",out.length+1,"Vuelta")));
  }
  return out;
}

function generateCopaBracket(t,entrants){
  // Bracket estándar de eliminación directa.
  // La copa se arma desde una llave potencia de 2 para que los pases libres estén SOLO en la primera instancia.
  // Ejemplo 6 participantes: Cuartos = 2 pases libres + 2 partidos; Semifinal = 2 partidos; Final = 1 partido.
  // Así evitamos que alguien juegue cuartos y después aparezca erróneamente con pase libre en semifinal.
  let units=shuffle(cloneUnits(entrants||[]));
  let total=units.length;
  let matches=[];
  let rounds=[];
  let counter=1;
  if(total<2)return matches;

  let slots=nextPowerOfTwo(total);
  let byeCount=slots-total;
  let firstStage=stageForSlots(slots);
  let firstRound=[];
  let entrantIndex=0;

  function makeMatch(stage,a,b){
    let m={
      id:newMatchId(t,counter),
      tournamentId:t.id,
      tournamentName:t.name,
      mode:t.mode,
      format:t.format,
      legMode:t.legMode||t.copaLegs||"Ida",
      copaLegs:t.copaLegs||t.legMode||"Ida",
      round:stage,
      stage,
      code:`P${counter}`,
      teamA:a?[...a]:[`Ganador P${counter}A`],
      teamB:b?[...b]:[`Ganador P${counter}B`],
      scoreA:"",
      scoreB:"",
      scoreA2:"",
      scoreB2:"",
      played:false,
      date:""
    };
    counter++;
    return m;
  }

  // Primera instancia: asigna todos los pases libres necesarios al comienzo del cuadro.
  // Cada pase libre ocupa una llave real y alimenta la siguiente ronda como ganador automático.
  for(let i=0;i<slots/2;i++){
    let a=units[entrantIndex++]||null;
    let b=null;
    if(i>=byeCount){
      b=units[entrantIndex++]||null;
    }
    let m=makeMatch(firstStage,a,b);
    if(!b){
      m.bye=true;
      m.directBye=teamReady(m.teamA);
      m.teamB=['Pase libre'];
      m.played=true;
      m.date=todayISO();
    }
    firstRound.push(m);
    matches.push(m);
  }
  rounds.push(firstRound);

  // Rondas siguientes: siempre se crean completas con placeholders de ganadores.
  // No se generan más pases libres después de la primera instancia.
  let previous=firstRound;
  let currentSlots=slots/2;
  while(currentSlots>1){
    let stage=stageForSlots(currentSlots);
    let round=[];
    for(let i=0;i<previous.length;i+=2){
      let left=previous[i];
      let right=previous[i+1];
      let m=makeMatch(stage,[`Ganador ${left.code}`],[`Ganador ${right.code}`]);
      round.push(m);
      matches.push(m);
    }
    rounds.push(round);
    previous=round;
    currentSlots=currentSlots/2;
  }

  // Vincular cada partido/pase libre con el slot correspondiente de la siguiente instancia.
  for(let r=0;r<rounds.length-1;r++){
    rounds[r].forEach((m,i)=>{
      let next=rounds[r+1][Math.floor(i/2)];
      if(!next)return;
      m.nextMatchId=next.id;
      m.nextSlot=i%2===0?"A":"B";
      if(m.nextSlot==="A"){
        next.sourceA=m.id;
        next.teamA=[`Ganador ${m.code}`];
      }else{
        next.sourceB=m.id;
        next.teamB=[`Ganador ${m.code}`];
      }
    });
  }

  // Propagar automáticamente los pases libres de primera ronda hacia semifinal/cuadro siguiente.
  matches.filter(m=>m.bye&&m.nextMatchId&&teamReady(m.teamA)).forEach(m=>propagateWinner(m,m.teamA,matches));
  return matches;
}

function stageForEntrantCount(n){
  if(n<=2)return "Final";
  if(n<=4)return "Semifinal";
  if(n<=8)return "Cuartos";
  if(n<=16)return "Octavos";
  return "Ronda";
}

function getMatches(tid){return state.matches.filter(m=>m.tournamentId==tid)}
function findMatch(id, collection=state.matches){return collection.find(m=>String(m.id)===String(id))}
function propagateWinner(match,winner,collection=state.matches){
  if(!match||!teamReady(winner))return;
  let t=state.tournaments.find(x=>x.id===match.tournamentId);
  if(!match.nextMatchId){
    if(t){t.champion=teamName(winner);t.status="Completo";}
    return;
  }
  let next=findMatch(match.nextMatchId,collection);
  if(!next)return;
  if(match.nextSlot==="A")next.teamA=[...winner]; else next.teamB=[...winner];

  // Si el casillero siguiente es un pase libre, no debe quedar esperando carga manual:
  // apenas se conoce el jugador/equipo que llega a ese slot, avanza automáticamente.
  if(next.bye&&isResolvedBye(next)){
    next.played=true;
    next.date=next.date||new Date().toISOString().slice(0,10);
    propagateWinner(next,byeWinnerTeam(next),collection);
  }
}
function clearDownstream(match){
  if(!match.nextMatchId)return;
  let next=findMatch(match.nextMatchId); if(!next)return;
  if(match.nextSlot==="A")next.teamA=[`Ganador ${match.code}`]; else next.teamB=[`Ganador ${match.code}`];
  next.scoreA="";next.scoreB="";next.scoreA2="";next.scoreB2="";next.penA="";next.penB="";next.played=false;next.date="";
  let t=state.tournaments.find(x=>x.id===match.tournamentId); if(t){delete t.champion;t.status="En curso";}
  clearDownstream(next);
}
function canEditMatch(m){let t=state.tournaments.find(x=>x.id===m.tournamentId);return !t?.locked&&!m.bye&&!isPlaceholder(m.teamA)&&!isPlaceholder(m.teamB)}
function isTournamentComplete(t){
  let ms=getMatches(t.id);
  if(!ms.length)return false;
  if(t.format==="Copa")return Boolean(t.champion)||ms.some(m=>m.stage==="Final"&&m.played&&!m.bye);
  return ms.every(m=>m.played);
}

function getTournamentChampion(t){
  if(!t)return "";
  if(t.format==="Copa"){
    if(t.champion)return t.champion;
    let final=getMatches(t.id).find(m=>m.stage==="Final"&&m.played&&!m.bye);
    return final&&winnerOf(final)?teamName(winnerOf(final)):"";
  }
  let table=t.mode==="2v2"?teamStats(t.id):stats(t.id);
  return table[0]?.player||"";
}

function scopeLabel(scope){return scope==='Liga'?'Solo ligas':scope==='Copa'?'Solo copas':'General';}
function matchInScope(m,scope='General'){
  if(scope==='Liga')return m.format==='Liga';
  if(scope==='Copa')return m.format==='Copa';
  return true;
}
function recordInScope(r,scope='General'){

  if(scope==='Copa')return r.format==='Copa';
  return true;
}
function titleRecordsScoped(scope='General'){

}
function getTournamentRunnerUp(t){
  if(!t)return '';
  let champ=t.champion||getTournamentChampion(t);
  if(!champ)return '';
  if(t.format==='Copa'){
    let final=getMatches(t.id).find(m=>m.stage==='Final'&&m.played&&!m.bye);
    if(!final)return '';
    let loser=teamName(final.teamA)===champ?teamName(final.teamB):teamName(final.teamA);
    return loser||'';
  }
  let table=t.mode==='2v2'?teamStats(t.id):stats(t.id);
  return table.find(x=>x.player!==champ)?.player||'';
}
function tournamentSummary(t){
  if(!t)return null;
  let champ=t.champion||getTournamentChampion(t), runner=getTournamentRunnerUp(t);
  let table=t.mode==='2v2'?teamStats(t.id):stats(t.id);
  let bestAttack=table.slice().sort((a,b)=>b.gf-a.gf||b.pts-a.pts||a.player.localeCompare(b.player))[0]||null;
  let bestDefense=table.slice().filter(x=>x.pj>0).sort((a,b)=>a.gc-b.gc||b.pts-a.pts||a.player.localeCompare(b.player))[0]||null;
  let mostWins=table.slice().sort((a,b)=>b.pg-a.pg||b.pts-a.pts||a.player.localeCompare(b.player))[0]||null;
  let ms=getMatches(t.id).filter(m=>m.played&&!m.bye);
  let path=[];
  if(t.format==='Copa'&&champ){
    ms.filter(m=>teamName(m.teamA)===champ||teamName(m.teamB)===champ)
      .sort((a,b)=>stageOrder(ms).indexOf(a.stage)-stageOrder(ms).indexOf(b.stage)||String(a.code).localeCompare(String(b.code)))
      .forEach(m=>path.push(`${m.stage||m.round}: ${teamName(m.teamA)} ${scoreText(m)} ${teamName(m.teamB)}`));
  }
  return {champ,runner,bestAttack,bestDefense,mostWins,path,played:ms.length};
}
function summaryHtml(t){
  let s=tournamentSummary(t); if(!s)return '';
  const nameHtml=(name)=>t.mode==='2v2'?teamFromNameHtml(name,'left','photoMini'):playerInline(name,'photoMini');
  return `<div class="card"><b>📌 Resumen del torneo</b><p class="subtle">MVP estadístico y datos principales del torneo.</p><div class="divider"></div><div class="historyGrid"><div class="recordCard"><span class="muted">🏆 Campeón</span><div class="recordValue" style="font-size:18px">${s.champ?nameHtml(s.champ):'-'}</div></div><div class="recordCard"><span class="muted">🥈 Subcampeón</span><div class="recordValue" style="font-size:18px">${s.runner?nameHtml(s.runner):'-'}</div></div><div class="recordCard"><span class="muted">⚽ Mejor ataque</span><div class="recordValue" style="font-size:18px">${s.bestAttack?nameHtml(s.bestAttack.player):'-'}</div>${s.bestAttack?`<p class="small">${s.bestAttack.gf} goles</p>`:''}</div><div class="recordCard"><span class="muted">🧤 Mejor defensa</span><div class="recordValue" style="font-size:18px">${s.bestDefense?nameHtml(s.bestDefense.player):'-'}</div>${s.bestDefense?`<p class="small">${s.bestDefense.gc} goles recibidos</p>`:''}</div><div class="recordCard"><span class="muted">⭐ Más victorias</span><div class="recordValue" style="font-size:18px">${s.mostWins?nameHtml(s.mostWins.player):'-'}</div>${s.mostWins?`<p class="small">${s.mostWins.pg} triunfos</p>`:''}</div><div class="recordCard"><span class="muted">🕹️ Partidos jugados</span><div class="recordValue">${s.played}</div></div></div>${s.path.length?`<div class="divider"></div><b>Camino al título</b>${s.path.map(x=>`<div class="timelineItem"><p class="small">${esc(x)}</p></div>`).join('')}`:''}</div>`;

function fameData(){
  let players={}, teams={};
  PLAYERS.forEach(p=>players[p]={name:p,total:0,liga1:0,copa1:0,liga2:0,copa2:0});
  titleRecords().forEach(r=>{
    if(r.mode==="2v2"){
      if(!teams[r.champion])teams[r.champion]={name:r.champion,total:0,liga2:0,copa2:0};
      teams[r.champion].total++;
      if(r.format==="Liga")teams[r.champion].liga2++; else teams[r.champion].copa2++;
      r.champion.split(" + ").forEach(p=>{
        if(!players[p])players[p]={name:p,total:0,liga1:0,copa1:0,liga2:0,copa2:0};
        players[p].total++;
        if(r.format==="Liga")players[p].liga2++; else players[p].copa2++;
      });
    }else{
      let p=r.champion;
      if(!players[p])players[p]={name:p,total:0,liga1:0,copa1:0,liga2:0,copa2:0};
      players[p].total++;
      if(r.format==="Liga")players[p].liga1++; else players[p].copa1++;
    }
  });
  const sort=(a,b)=>b.total-a.total||a.name.localeCompare(b.name);
  return {players:Object.values(players).filter(x=>x.total>0).sort(sort),teams:Object.values(teams).filter(x=>x.total>0).sort(sort)};
}

function finalizeTournament(id){
  let t=state.tournaments.find(x=>x.id==id); if(!t)return;
  if(!isTournamentComplete(t)){alert("Todavía quedan partidos por jugar.");return;}
  t.champion=t.champion||getTournamentChampion(t);
  t.locked=true;t.status="Finalizado";t.closedAt=todayISO();
  save();render();
}
function finalPanel(t){
  if(t.locked){let champ=t.champion||getTournamentChampion(t);return `<div class="warn" style="background:#ecfdf5;border-color:#bbf7d0;color:#166534">🔒 Torneo finalizado y guardado. Los resultados ya no se pueden editar.${champ?`<div class="divider"></div><div class="small">CAMPEÓN</div><div class="championPhoto">🏆 ${t.mode==='2v2'?teamFromNameHtml(champ,'left','photoMini'):playerInline(champ,'photoMini')}</div>`:''}</div>${summaryHtml(t)}`;}

}


function stats(tid="all"){
  let t=tid==="all"?null:state.tournaments.find(x=>x.id==tid);
  let ms=(tid==="all"?state.matches:state.matches.filter(m=>m.tournamentId==tid)).filter(m=>m.played&&!m.bye);
  let allowed=(t&&Array.isArray(t.players)&&t.players.length)?t.players:PLAYERS;
  let st={};allowed.forEach(p=>st[p]={player:p,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0});
  ms.forEach(m=>{let agg=aggregateScore(m),a=agg.a,b=agg.b,draw=a===b;[...m.teamA,...m.teamB].forEach(p=>{if(!st[p])st[p]={player:p,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0}});m.teamA.forEach(p=>{st[p].pj++;st[p].gf+=a;st[p].gc+=b;if(draw){st[p].pe++;st[p].pts++}});m.teamB.forEach(p=>{st[p].pj++;st[p].gf+=b;st[p].gc+=a;if(draw){st[p].pe++;st[p].pts++}});if(!draw){(a>b?m.teamA:m.teamB).forEach(p=>{st[p].pg++;st[p].pts+=3});(a>b?m.teamB:m.teamA).forEach(p=>st[p].pp++)}});
  return Object.values(st).map(s=>({...s,diff:s.gf-s.gc})).sort((a,b)=>b.pts-a.pts||b.diff-a.diff||b.gf-a.gf||a.player.localeCompare(b.player));
}
function teamStats(tid){
  let ms=state.matches.filter(m=>m.tournamentId==tid&&m.played&&!m.bye), st={};
  state.matches.filter(m=>m.tournamentId==tid&&m.mode==='2v2'&&!m.bye).forEach(m=>[m.teamA,m.teamB].forEach(team=>{if(isPlaceholder(team))return;let name=teamName(team);if(!st[name])st[name]={player:name,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0}}));
  ms.forEach(m=>{let agg=aggregateScore(m),a=agg.a,b=agg.b,draw=a===b,ta=teamName(m.teamA),tb=teamName(m.teamB);if(!st[ta])st[ta]={player:ta,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0};if(!st[tb])st[tb]={player:tb,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0};st[ta].pj++;st[ta].gf+=a;st[ta].gc+=b;st[tb].pj++;st[tb].gf+=b;st[tb].gc+=a;if(draw){st[ta].pe++;st[ta].pts++;st[tb].pe++;st[tb].pts++;}else if(a>b){st[ta].pg++;st[ta].pts+=3;st[tb].pp++;}else{st[tb].pg++;st[tb].pts+=3;st[ta].pp++;}});
  return Object.values(st).map(s=>({...s,diff:s.gf-s.gc})).sort((a,b)=>b.pts-a.pts||b.diff-a.diff||b.gf-a.gf||a.player.localeCompare(b.player));
}

function best2v2HomeTeam(records){
  // En la Home priorizamos el campeón vigente/último torneo 2vs2 cerrado.
  // Si todavía no hay torneos finalizados, recién ahí usamos rendimiento por partidos jugados.
  let latest2=(records||[]).find(r=>r.mode==='2v2'&&r.champion);
  if(latest2){
    return {name:latest2.champion, team:String(latest2.champion||'').split(' + ').map(x=>x.trim()).filter(Boolean), note:`Campeones vigentes · ${esc(latest2.name)}`};
  }
  let table={};
  state.matches.filter(m=>m.played&&!m.bye&&m.mode==='2v2').forEach(m=>{
    let agg=aggregateScore(m), winner=winnerOf(m), aName=teamName(m.teamA), bName=teamName(m.teamB);
    [aName,bName].forEach(n=>{if(!table[n])table[n]={name:n,team:String(n).split(' + ').map(x=>x.trim()).filter(Boolean),pj:0,w:0,d:0,l:0,gf:0,gc:0,pts:0}});
    let draw=!winner;
    table[aName].pj++; table[bName].pj++;
    table[aName].gf+=agg.a; table[aName].gc+=agg.b;
    table[bName].gf+=agg.b; table[bName].gc+=agg.a;
    if(draw){table[aName].d++; table[bName].d++; table[aName].pts++; table[bName].pts++; return;}
    let wName=teamName(winner), lName=wName===aName?bName:aName;
    table[wName].w++; table[wName].pts+=3; table[lName].l++;
  });
  let best=Object.values(table).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||b.w-a.w||a.name.localeCompare(b.name))[0];
  return best?{name:best.name,team:best.team,note:`Mejor rendimiento: ${best.pts} pts · ${best.w} PG · DG ${best.gf-best.gc}`}:null;
}

function scoreValue(v){return v!==undefined&&v!==null&&String(v)!==''}
function cupTwoLegged(m){return m&&m.format==='Copa'&&matchLegMode(m)==='Ida y vuelta'&&!m.bye}
function cupLegDone(m,leg){return leg==='ida'?scoreValue(m.scoreA)&&scoreValue(m.scoreB):scoreValue(m.scoreA2)&&scoreValue(m.scoreB2)}
function cupLegScore(m,leg){
  if(!cupLegDone(m,leg))return 'vs';
  return leg==='ida'?`${m.scoreA} - ${m.scoreB}`:`${m.scoreA2} - ${m.scoreB2}`;
}
function cupLegTeams(m,leg){return leg==='ida'?{home:m.teamA,away:m.teamB}:{home:m.teamB,away:m.teamA}}
function cupLegCard(m,leg,editable=true){
  if(m.bye)return matchCard(m,editable);
  let t=state.tournaments.find(x=>x.id===m.tournamentId);
  let pending=!teamReady(m.teamA)||!teamReady(m.teamB);
  let done=cupLegDone(m,leg);
  let teams=cupLegTeams(m,leg);
  let label=leg==='ida'?'Partido de ida':'Partido de vuelta';
  let locked=t?.locked;
  let btn='';
  if(editable){
    if(locked)btn=`<p class="small" style="margin-top:10px">🔒 Torneo cerrado</p>`;
    else if(pending)btn=`<p class="small" style="margin-top:10px">Se completa cuando avancen los ganadores anteriores.</p>`;
    else if(leg==='vuelta'&&!cupLegDone(m,'ida'))btn=`<p class="small" style="margin-top:10px">Primero cargá el partido de ida.</p>`;
    else btn=`<button class="${done?'btnEdit':'btnLoad'}" style="width:100%;margin-top:12px" onclick="openScoreLeg(${m.id},'${leg}')">${done?'✏️ Corregir '+label.toLowerCase():'✅ Cargar '+label.toLowerCase()}</button>`;
  }
  return `<div class="match ${done?'played':''}"><div class="matchTop"><span class="tag">${esc(m.stage||m.round)}</span><span class="round">${esc(m.code||m.round)} · ${label}</span></div><div class="vs"><div class="team">${teamHtml(teams.home)}</div><div class="score">${cupLegScore(m,leg)}</div><div class="team right">${teamHtml(teams.away,'right')}</div></div>${btn}</div>`;
}
function cupTieSummary(m){
  if(!cupTwoLegged(m))return '';
  if(!cupLegDone(m,'ida')&&!cupLegDone(m,'vuelta'))return '';
  let agg=aggregateScore(m), w=m.played?winnerOf(m):null;
  let pen=(agg.a===agg.b&&scoreValue(m.penA)&&scoreValue(m.penB))?` · Penales ${m.penA}-${m.penB}`:'';
  let status=w?`Ganador: ${esc(teamName(w))}`:(cupLegDone(m,'ida')&&cupLegDone(m,'vuelta')?'Global empatado: faltan penales':'Llave en curso');
  return `<div class="editNote" style="margin:0 0 12px"><b>Global ${esc(teamName(m.teamA))} ${agg.a} - ${agg.b} ${esc(teamName(m.teamB))}${pen}</b><br>${status}</div>`;
}
function cupFixtureStageHtml(ms,st,editable=true){
  let v=visibleCupMatches(ms,st);
  let done=v.filter(m=>m.bye?isResolvedBye(m):m.played).length;
  let byes=v.filter(m=>m.bye);
  let normal=v.filter(m=>!m.bye);
  let twoLeg=normal.some(cupTwoLegged);
  let body='';
  if(twoLeg){
    body+=byes.map(m=>matchCard(m,editable)).join('');
    body+=normal.map(m=>cupLegCard(m,'ida',editable)).join('');
    body+=normal.map(m=>cupLegCard(m,'vuelta',editable)).join('');
    body+=normal.map(cupTieSummary).join('');
  }else{
    body+=v.map(m=>matchCard(m,editable)).join('');
  }
  return `<div class="stageTitle"><b>${esc(st)}</b><span class="small">${done}/${v.length}</span></div>${body}`;
}
function matchCard(m,editable=true){let t=state.tournaments.find(x=>x.id===m.tournamentId);if(m.bye){if(!isVisibleBye(m))return "";let bw=byeDisplayTeam(m);let resolved=isResolvedBye(m);return `<div class="match ${resolved?'played':''}"><div class="matchTop"><span class="tag">${esc(m.stage)}</span><span class="round">Pase libre</span></div><div class="vs"><div class="team">${teamHtml(bw)}</div><div class="score">➡️</div><div class="team right">${resolved?'Avanza':'Espera'}</div></div><p class="small" style="margin-top:10px">${byeStatusText(m)}</p></div>`;}let pending=!teamReady(m.teamA)||!teamReady(m.teamB);let btn="";if(editable){if(t?.locked)btn=`<p class="small" style="margin-top:10px">🔒 Torneo cerrado</p>`;else if(pending)btn=`<p class="small" style="margin-top:10px">Se completa cuando avancen los ganadores anteriores.</p>`;else btn=`<button class="${m.played?'btnEdit':'btnLoad'}" style="width:100%;margin-top:12px" onclick="openScore(${m.id})">${m.played?'✏️ Corregir resultado':'✅ Cargar resultado'}</button>`;}return `<div class="match ${m.played?'played':''}"><div class="matchTop"><span class="tag">${esc(m.stage||m.round)}</span><span class="round">${esc(m.code||m.round)}</span></div><div class="vs"><div class="team">${teamHtml(m.teamA)}</div><div class="score">${scoreText(m)}</div><div class="team right">${teamHtml(m.teamB,'right')}</div></div>${btn}</div>`}

function directMatchUnits(mode){
  let base=state.matches.filter(m=>m.played&&!m.bye&&m.mode===mode);
  let out=[];
  base.forEach(m=>{
    if(cupTwoLegged(m)){
      if(cupLegDone(m,'ida'))out.push({...m,scoreA:m.scoreA,scoreB:m.scoreB,scoreA2:"",scoreB2:"",legMode:"Ida",copaLegs:"Ida",round:`${m.round||m.stage} · Ida`,stage:m.stage,code:`${m.code||''} Ida`});
      if(cupLegDone(m,'vuelta'))out.push({...m,teamA:[...(m.teamB||[])],teamB:[...(m.teamA||[])],scoreA:m.scoreA2,scoreB:m.scoreB2,scoreA2:"",scoreB2:"",legMode:"Ida",copaLegs:"Ida",round:`${m.round||m.stage} · Vuelta`,stage:m.stage,code:`${m.code||''} Vuelta`});

function orderedPlayedMatches(){
  return state.matches.filter(m=>m.played&&!m.bye).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))||Number(a.id)-Number(b.id));
}
function matchPlayers(m){return [...(m.teamA||[]),...(m.teamB||[])].filter(p=>PLAYERS.includes(p))}
function matchWinnerPlayers(m){let w=winnerOf(m);return Array.isArray(w)?w.filter(p=>PLAYERS.includes(p)):[]}
function matchLoserPlayers(m){let w=matchWinnerPlayers(m);if(!w.length)return [];return matchPlayers(m).filter(p=>!w.includes(p))}
function allPlayerStats(scope='General'){
  let base={};PLAYERS.forEach(p=>base[p]={name:p,pj:0,w:0,d:0,l:0,gf:0,gc:0,finals:0,titles:0});
  orderedPlayedMatches().filter(m=>matchInScope(m,scope)).forEach(m=>{
    let a=Number(m.scoreA),b=Number(m.scoreB),draw=a===b,wp=matchWinnerPlayers(m),lp=matchLoserPlayers(m);
    (m.teamA||[]).forEach(p=>{if(!base[p])return;base[p].pj++;base[p].gf+=a;base[p].gc+=b});
    (m.teamB||[]).forEach(p=>{if(!base[p])return;base[p].pj++;base[p].gf+=b;base[p].gc+=a});
    if(draw&&!wp.length)matchPlayers(m).forEach(p=>base[p].d++); else {wp.forEach(p=>base[p]&&(base[p].w++));lp.forEach(p=>base[p]&&(base[p].l++));}
    if(m.format==='Copa'&&m.stage==='Final')matchPlayers(m).forEach(p=>base[p]&&(base[p].finals++));
  });
  titleRecordsScoped(scope).forEach(r=>{
    let ps=r.mode==='2v2'?String(r.champion||'').split(' + ').map(x=>x.trim()).filter(Boolean):[r.champion];
    ps.forEach(p=>{if(base[p])base[p].titles++});
  });
  return Object.values(base).map(x=>({...x,diff:x.gf-x.gc,eff:x.pj?Math.round((x.w/x.pj)*100):0}));
}


function historicalRanking(scope='General'){
  let base={};
  PLAYERS.forEach(p=>base[p]={name:p,points:0,pj:0,w:0,d:0,l:0,titles:0});
  orderedPlayedMatches().filter(m=>matchInScope(m,scope)).forEach(m=>{
    let players=matchPlayers(m);
    if(!players.length)return;
    let wp=matchWinnerPlayers(m);
    let lp=matchLoserPlayers(m);
    let agg=aggregateScore(m);
    let draw=!wp.length && agg.a===agg.b;
    players.forEach(p=>{if(base[p])base[p].pj++});
    if(draw){players.forEach(p=>{if(base[p]){base[p].d++;base[p].points+=1;}})}
    else{wp.forEach(p=>{if(base[p]){base[p].w++;base[p].points+=3;}});lp.forEach(p=>{if(base[p])base[p].l++;});}
  });
  titleRecordsScoped(scope).forEach(r=>{
    let ps=r.mode==='2v2'?String(r.champion||'').split(' + ').map(x=>x.trim()).filter(Boolean):[r.champion];
    ps.forEach(p=>{if(base[p]){base[p].titles++;base[p].points+=10;}});
  });
  return Object.values(base).filter(x=>x.points>0||x.pj>0||x.titles>0).sort((a,b)=>b.points-a.points||b.titles-a.titles||b.w-a.w||a.name.localeCompare(b.name));
}


function eloRankings(){
  // ELO individual: solo cuenta partidos 1vs1 realmente jugados.
  // Así evitamos que un jugador sin partidos (ej: Alva) aparezca arriba con 1500 puntos por defecto.
  let elo={}, games={};
  PLAYERS.forEach(p=>{elo[p]=1500;games[p]=0});
  const k=32;
  orderedPlayedMatches().filter(m=>m.mode==='1v1' && !m.bye).forEach(m=>{
    let aTeam=(m.teamA||[]).filter(p=>PLAYERS.includes(p));
    let bTeam=(m.teamB||[]).filter(p=>PLAYERS.includes(p));
    if(aTeam.length!==1||bTeam.length!==1)return;
    let a=aTeam[0], b=bTeam[0];
    let ea=1/(1+Math.pow(10,(elo[b]-elo[a])/400));
    let sa=.5;
    let w=winnerOf(m);
    if(w){
      let wn=teamName(w);
      if(wn===teamName(m.teamA))sa=1;
      else if(wn===teamName(m.teamB))sa=0;
    }
    let delta=Math.round(k*(sa-ea));
    elo[a]+=delta;
    elo[b]-=delta;
    games[a]++;
    games[b]++;
  });
  return {
    players:Object.entries(elo)
      .filter(([name])=>games[name]>0)
      .map(([name,val])=>({name,elo:Math.round(val),games:games[name]}))
      .sort((a,b)=>b.elo-a.elo||b.games-a.games||a.name.localeCompare(b.name))
  };
}
function streakData(scope='General'){
  let cur={}, best={};
  PLAYERS.forEach(p=>{
    cur[p]={name:p,type:'',count:0};
    best[p]={name:p,bestWin:0,bestLoss:0};
  });
  orderedPlayedMatches().filter(m=>matchInScope(m,scope)).forEach(m=>{
    let participants=[...(m.teamA||[]),...(m.teamB||[])];
    let wp=matchWinnerPlayers(m), lp=matchLoserPlayers(m);

    // Si hubo empate, se cortan tanto las rachas positivas como negativas
    // de quienes jugaron ese partido.
    if(!wp.length){
      participants.forEach(p=>{cur[p].type='D';cur[p].count=0;});
      return;
    }

    wp.forEach(p=>{
      cur[p].count=cur[p].type==='W'?cur[p].count+1:1;
      cur[p].type='W';
      best[p].bestWin=Math.max(best[p].bestWin,cur[p].count);
    });
    lp.forEach(p=>{
      cur[p].count=cur[p].type==='L'?cur[p].count+1:1;
      cur[p].type='L';
      best[p].bestLoss=Math.max(best[p].bestLoss,cur[p].count);
    });
  });
  let arr=Object.values(best);
  let bestWin=arr.filter(x=>x.bestWin>0).sort((a,b)=>b.bestWin-a.bestWin||a.name.localeCompare(b.name))[0]||null;
  let bestLoss=arr.filter(x=>x.bestLoss>0).sort((a,b)=>b.bestLoss-a.bestLoss||a.name.localeCompare(b.name))[0]||null;
  return {
    bestWin:bestWin?{name:bestWin.name,count:bestWin.bestWin}:null,
    bestLoss:bestLoss?{name:bestLoss.name,count:bestLoss.bestLoss}:null,
    all:arr
  };
}
function recordsData(scope='General'){
  let st=allPlayerStats(scope), titles=fameData().players.map(p=>({...p,total:titleRecordsScoped(scope).reduce((acc,r)=>{
    let ps=r.mode==='2v2'?String(r.champion||'').split(' + ').map(x=>x.trim()).filter(Boolean):[r.champion];
    return acc+(ps.includes(p.name)?1:0);
  },0)}));
  let top=(arr,fn)=>{let clean=arr.filter(x=>fn(x)>0).sort((a,b)=>fn(b)-fn(a)||a.name.localeCompare(b.name)); if(!clean.length)return []; let max=fn(clean[0]); return clean.filter(x=>fn(x)===max).slice(0,2);};
  let effClean=st.filter(x=>x.pj>=3&&x.eff>0).sort((a,b)=>b.eff-a.eff||b.w-a.w||a.name.localeCompare(b.name));
  let eff=effClean.length?effClean.filter(x=>x.eff===effClean[0].eff).slice(0,2):[];
  return {goals:top(st,x=>x.gf),wins:top(st,x=>x.w),finals:top(st,x=>x.finals),titles:top(titles,x=>x.total),eff:eff,diff:top(st,x=>x.diff)};
}

function classicsData(){
  let map={};
  directMatchUnits('1v1').forEach(m=>{
    let a=m.teamA?.[0], b=m.teamB?.[0]; if(!a||!b)return;
    let key=[a,b].sort().join('|'); if(!map[key])map[key]={a:[a,b].sort()[0],b:[a,b].sort()[1],pj:0,wa:0,wb:0,d:0};
    let r=map[key]; r.pj++;
    let w=winnerOf(m)?.[0]; if(!w)r.d++; else if(w===r.a)r.wa++; else if(w===r.b)r.wb++;
  });
  return Object.values(map).sort((x,y)=>y.pj-x.pj).slice(0,3);
}

function confirmManualTeams(){

  let teams=[];

  for(let i=0;i<sel.length/2;i++){
    let a=$("manualA_"+i)?.value;

    if(!a||!b){alert('Completá todos los equipos.');return}

  let duplicates=used.filter((p,i)=>used.indexOf(p)!==i);
  if(duplicates.length){alert('Hay jugadores repetidos. Revisá las parejas antes de confirmar.');return}

function applyTournamentDeletion(baseState,idStr){
  const safe=normalizeStateShape(baseState);
  const deleted=[...new Set([...(safe.deletedTournamentIds||[]).map(String), String(idStr)])];
  const deletedSet=new Set(deleted);
  return {
    tournaments:(safe.tournaments||[]).filter(x=>!deletedSet.has(String(x.id))),
    matches:(safe.matches||[]).filter(m=>!deletedSet.has(String(m.tournamentId))),
    deletedTournamentIds:deleted
  };
}
async function deleteTournament(id){
  const idStr=String(id);
  const t=state.tournaments.find(x=>String(x.id)===idStr);
  if(!t)return;
  if(!confirm(`¿Eliminar "${t.name}"? Se borran también sus partidos y resultados.`))return;
  if(!confirm(`Confirmación final: esta acción no se puede deshacer. ¿Seguro que querés eliminar "${t.name}"?`))return;

  pendingDeletedTournamentIds.add(idStr);
  state=applyTournamentDeletion(state,idStr);
  if(String(ui.selectedTournament)===idStr) ui.selectedTournament=state.tournaments[0]?.id||null;
  localStorage.setItem(KEY,JSON.stringify(state));
  render();

  if(!db){
    alert('Torneo eliminado en este dispositivo. Firebase no está conectado, por eso no se pudo sincronizar online.');
    return;
  }

  try{
    syncingFromCloud=true;
    await db.ref(DB_PATH).transaction(current=>{
      const currentState=normalizeCloudState(current)||state;
      return applyTournamentDeletion(currentState,idStr);
    });
  }catch(err){
    console.warn("No se pudo borrar en Firebase", err);
    alert("No se pudo borrar en Firebase. Revisá las reglas de escritura de Realtime Database.");
  }finally{
    syncingFromCloud=false;
    setTimeout(()=>pendingDeletedTournamentIds.delete(idStr),2500);
  }
}

function openScoreLeg(id,leg){
  let m=findMatch(id);if(!m)return;
  let t=state.tournaments.find(x=>x.id===m.tournamentId);
  if(t?.locked){alert('Este torneo ya fue finalizado y no se puede editar.');return}
  if(!cupTwoLegged(m)||!canEditMatch(m)){alert('Este partido todavía no está habilitado. Primero deben definirse los ganadores anteriores.');return}
  if(leg==='vuelta'&&!cupLegDone(m,'ida')){alert('Primero cargá el partido de ida.');return}
  let teams=cupLegTeams(m,leg);
  let isVuelta=leg==='vuelta';
  let hVal=isVuelta?(m.scoreA2??''):m.scoreA;
  let aVal=isVuelta?(m.scoreB2??''):m.scoreB;
  let label=isVuelta?'Partido de vuelta':'Partido de ida';
  let agg=aggregateScore(m);
  let showPens=isVuelta&&cupLegDone(m,'ida')&&scoreValue(hVal)&&scoreValue(aVal)&&agg.a===agg.b;
  $("modalBody").innerHTML=`<h3 style="margin:0 0 12px">${cupLegDone(m,leg)?'Corregir':'Cargar'} ${label.toLowerCase()}</h3><div class="match"><p class="subtle">${esc(m.tournamentName)} · ${esc(m.stage||m.round)} · ${esc(m.code)} · ${label}</p><b>${esc(teamName(teams.home))} vs ${esc(teamName(teams.away))}</b>${cupLegDone(m,leg)?`<div style="font-size:20px;font-weight:1000;margin-top:8px">${cupLegScore(m,leg)}</div>`:''}</div><div class="warn" style="margin-top:10px">Copa ida y vuelta: se carga cada partido por separado. La vuelta se habilita después de cargar la ida. Si el global queda empatado, cargá penales para definir quién avanza.</div><div class="grid2" style="margin-top:12px"><input id="legHome" type="number" placeholder="${esc(teamName(teams.home))}" value="${hVal}" oninput="togglePensLeg(${m.id},'${leg}')"><input id="legAway" type="number" placeholder="${esc(teamName(teams.away))}" value="${aVal}" oninput="togglePensLeg(${m.id},'${leg}')"></div>${isVuelta?`<div id="pensBox" style="display:${showPens?'block':'none'};margin-top:12px"><div class="label">Penales</div><div class="grid2"><input id="pa" type="number" placeholder="Penales ${esc(teamName(m.teamA))}" value="${m.penA??''}"><input id="pb" type="number" placeholder="Penales ${esc(teamName(m.teamB))}" value="${m.penB??''}"></div><p class="subtle" style="margin-top:8px">Los penales se cargan según la llave original: ${esc(teamName(m.teamA))} vs ${esc(teamName(m.teamB))}.</p></div>`:''}<div class="grid2" style="margin-top:12px"><button class="choice" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveScoreLeg(${m.id},'${leg}')">Guardar</button></div>`;
  $("modal").classList.add('active');

function togglePensLeg(id,leg){
  let m=findMatch(id); if(!m||!cupTwoLegged(m)||leg!=='vuelta')return;
  let box=$("pensBox"); if(!box)return;
  let home=$("legHome")?.value, away=$("legAway")?.value;
  if(home===''||away===''||!cupLegDone(m,'ida')){box.style.display='none';return}
  let aggA=Number(m.scoreA||0)+Number(away||0);
  let aggB=Number(m.scoreB||0)+Number(home||0);
  box.style.display=(aggA===aggB)?'block':'none';
}
function saveScoreLeg(id,leg){
  let m=findMatch(id); if(!m||!cupTwoLegged(m))return;
  let t=state.tournaments.find(x=>x.id===m.tournamentId);
  if(t?.locked){alert('Este torneo está cerrado.');return}
  let home=$("legHome")?.value, away=$("legAway")?.value;
  if(home===''||away==='')return;
  let wasPlayed=m.played;
  if(cupLegDone(m,leg)&&!confirm('¿Seguro que querés corregir este resultado? Si depende de una llave posterior, se limpiará lo que corresponda.'))return;
  if(wasPlayed)clearDownstream(m);
  if(leg==='ida'){
    m.scoreA=+home; m.scoreB=+away;
    // Al corregir la ida, la vuelta y la definición vuelven a quedar abiertas.
    if(wasPlayed){m.scoreA2='';m.scoreB2='';m.penA='';m.penB='';}
  }else{
    if(!cupLegDone(m,'ida')){alert('Primero cargá el partido de ida.');return}
    m.scoreA2=+home; m.scoreB2=+away;
  }
  let both=cupLegDone(m,'ida')&&cupLegDone(m,'vuelta');
  m.played=false;
  if(both){
    let agg=aggregateScore(m);
    if(agg.a===agg.b){
      let pa=$("pa")?.value??'', pb=$("pb")?.value??'';
      if(pa===''||pb===''){save();closeModal();render();alert('El global quedó empatado. Cargá los penales en el partido de vuelta para definir quién avanza.');return}
      if(Number(pa)===Number(pb)){alert('Los penales no pueden quedar empatados. Tiene que haber un ganador.');return}
      m.penA=+pa;m.penB=+pb;
    }else{m.penA='';m.penB='';}
    m.played=true;
    m.date=new Date().toISOString().slice(0,10);
    propagateWinner(m,winnerOf(m));
  }
  if(t){delete t.champion;t.status='En curso';}
  save();closeModal();render();
}

function togglePens(id){
  let m=findMatch(id); if(!m||m.format!=='Copa')return;
  let box=$("pensBox"); if(!box)return;
  let idaVuelta=matchLegMode(m)==='Ida y vuelta';
  let a=$("sa")?.value, b=$("sb")?.value, a2=$("sa2")?.value, b2=$("sb2")?.value;
  if(idaVuelta){
    let ready=a!==''&&b!==''&&a2!==''&&b2!=='';
    let ga=Number(a||0)+Number(b2||0), gb=Number(b||0)+Number(a2||0);
    box.style.display=(ready&&ga===gb)?'block':'none';
  }else{
    box.style.display=(a!==''&&b!==''&&Number(a)===Number(b))?'block':'none';
  }
}
function saveScore(id){
  let m=findMatch(id),a=$("sa")?.value,b=$("sb")?.value;
  if(!m||a===''||b==='')return;
  let t=state.tournaments.find(x=>x.id===m.tournamentId);
  if(t?.locked){alert('Este torneo está cerrado.');return}
  let idaVuelta=m.format==='Copa'&&matchLegMode(m)==='Ida y vuelta';
  let a2=$("sa2")?.value??"", b2=$("sb2")?.value??"";
  if(idaVuelta&&(a2===''||b2==='')){alert('Cargá también el resultado de vuelta.');return}
  let aggA=Number(a)+Number(idaVuelta?b2:0), aggB=Number(b)+Number(idaVuelta?a2:0);
  let isDraw=idaVuelta?aggA===aggB:Number(a)===Number(b);
  let pa=$("pa")?.value??"", pb=$("pb")?.value??"";
  if(m.format==='Copa'&&isDraw){
    if(pa===''||pb===''){alert('La llave terminó empatada. Cargá los penales para definir quién avanza.');return}
    if(Number(pa)===Number(pb)){alert('Los penales no pueden quedar empatados. Tiene que haber un ganador.');return}
  }
  if(m.played&&!confirm('¿Seguro que querés corregir este resultado? Esto reemplaza el resultado anterior.'))return;
  if(m.played&&m.format==='Copa')clearDownstream(m);
  m.scoreA=+a;m.scoreB=+b;
  m.scoreA2=idaVuelta?+a2:"";m.scoreB2=idaVuelta?+b2:"";
  if(m.format==='Copa'&&isDraw){m.penA=+pa;m.penB=+pb;}else{m.penA="";m.penB="";}
  m.played=true;m.date=new Date().toISOString().slice(0,10);
  if(m.format==='Copa')propagateWinner(m,winnerOf(m));
  if(t&&t.format==='Liga'&&isTournamentComplete(t))t.status='Completo';
  save();closeModal();render()
}

}
function initFirebase(){
  try{
    if(!window.firebase || !firebase?.apps){console.warn("Firebase no disponible");return;}
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db=firebase.database();
    db.ref(DB_PATH).on('value', snap=>{
      let cloudState=normalizeCloudState(snap.val());
      if(cloudState){
        pendingDeletedTournamentIds.forEach(idStr=>{ cloudState=applyTournamentDeletion(cloudState,idStr); });
        cloudState=normalizeStateShape(cloudState);
        syncingFromCloud=true;
        state=cloudState;
        localStorage.setItem(KEY,JSON.stringify(state));
        if(ui.selectedTournament && !state.tournaments.some(t=>String(t.id)==String(ui.selectedTournament))){
          ui.selectedTournament=state.tournaments[0]?.id||null;
        }
        if(!ui.selectedTournament) ui.selectedTournament=state.tournaments[0]?.id||null;
        render();
        syncingFromCloud=false;
      }else{
        save();
      }
    }, err=>console.warn("No se pudo leer Firebase", err));
  }catch(err){
    console.warn("Firebase quedó desactivado", err);
  }
}

function showAuthScreen(errorMsg) {

        <div style="font-size:52px;margin-bottom:8px;">⚽</div>
        <h1 style="margin:0 0 4px;color:#052e1a;font-size:26px;font-weight:900;letter-spacing:-0.5px;">GoalMates</h1>
        <p style="color:#64748b;margin:0;font-size:13px;">Torneos con tus amigos</p>
      </div>
      <div id="auth-tabs" style="display:flex;background:#f0fdf4;border-radius:16px;padding:4px;margin-bottom:24px;">
        <button id="tab-login" onclick="switchAuthTab('login')" style="flex:1;padding:10px;border:none;border-radius:12px;background:white;color:#052e1a;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.1);">Ingresar</button>

      </div>
      ${errorMsg ? `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:10px 14px;margin-bottom:16px;color:#dc2626;font-size:13px;font-weight:600;">${errorMsg}</div>` : ''}
      <div style="display:flex;flex-direction:column;gap:12px;">
        <input id="auth-email" type="email" placeholder="Tu email" autocomplete="email"
          style="border:2px solid #d1fae5;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:600;color:#0f172a;background:#f0fdf4;outline:none;width:100%;box-sizing:border-box;">
        <input id="auth-pass" type="password" placeholder="Contraseña" autocomplete="current-password"
          style="border:2px solid #d1fae5;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:600;color:#0f172a;background:#f0fdf4;outline:none;width:100%;box-sizing:border-box;">
        <div id="auth-pass2-wrap" style="display:none;">
          <input id="auth-pass2" type="password" placeholder="Repetir contraseña" autocomplete="new-password"
            style="border:2px solid #d1fae5;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:600;color:#0f172a;background:#f0fdf4;outline:none;width:100%;box-sizing:border-box;">
        </div>
        <button id="auth-btn" onclick="doAuth()" style="background:linear-gradient(135deg,#16a34a,#052e1a);color:white;border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:900;cursor:pointer;margin-top:4px;">Ingresar</button>
      </div>

      </div>

  // allow enter key
  document.getElementById('auth-pass').addEventListener('keydown', e => { if(e.key==='Enter') doAuth(); });

  if(p2) p2.addEventListener('keydown', e => { if(e.key==='Enter') doAuth(); });

let _authMode = 'login';
function switchAuthTab(mode) {
  _authMode = mode;
  const isReg = mode === 'register';
  document.getElementById('tab-login').style.cssText = `flex:1;padding:10px;border:none;border-radius:12px;background:${isReg?'transparent':'white'};color:${isReg?'#64748b':'#052e1a'};font-weight:${isReg?'700':'800'};font-size:14px;cursor:pointer;${isReg?'':'box-shadow:0 2px 8px rgba(0,0,0,0.1);'}`;
  document.getElementById('tab-register').style.cssText = `flex:1;padding:10px;border:none;border-radius:12px;background:${isReg?'white':'transparent'};color:${isReg?'#052e1a':'#64748b'};font-weight:${isReg?'800':'700'};font-size:14px;cursor:pointer;${isReg?'box-shadow:0 2px 8px rgba(0,0,0,0.1);':''}`;
  document.getElementById('auth-pass2-wrap').style.display = isReg ? 'block' : 'none';
  document.getElementById('auth-btn').textContent = isReg ? 'Crear cuenta' : 'Ingresar';
  document.getElementById('auth-email').value = '';
  document.getElementById('auth-pass').value = '';
}

function doAuth() {
  const email = (document.getElementById('auth-email')?.value||'').trim();
  const pass = document.getElementById('auth-pass')?.value||'';
  if(!email || !pass) { showAuthScreen('Completá email y contraseña.'); return; }
  const btn = document.getElementById('auth-btn');
  if(btn) { btn.textContent = '...'; btn.disabled = true; }
  if(_authMode === 'register') {
    const pass2 = document.getElementById('auth-pass2')?.value||'';
    if(pass !== pass2) { showAuthScreen('Las contraseñas no coinciden.'); return; }
    if(pass.length < 6) { showAuthScreen('La contraseña debe tener al menos 6 caracteres.'); return; }
    firebase.auth().createUserWithEmailAndPassword(email, pass)
      .catch(err => showAuthScreen(authError(err)));
  } else {
    firebase.auth().signInWithEmailAndPassword(email, pass)
      .catch(err => showAuthScreen(authError(err)));
  }
}

function doForgotPassword() {
  const email = (document.getElementById('auth-email')?.value||'').trim();
  if(!email) { showAuthScreen('Ingresá tu email primero.'); return; }
  firebase.auth().sendPasswordResetEmail(email)
    .then(() => showAuthScreen('Te enviamos un email para recuperar tu contraseña.'))
    .catch(err => showAuthScreen(authError(err)));
}

function authError(err) {
  const map = {
    'auth/user-not-found': 'No existe una cuenta con ese email.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/invalid-email': 'Email inválido.',
    'auth/email-already-in-use': 'Ya existe una cuenta con ese email.',
    'auth/weak-password': 'La contraseña es muy débil (mínimo 6 caracteres).',
    'auth/too-many-requests': 'Demasiados intentos. Esperá unos minutos.',
    'auth/invalid-credential': 'Email o contraseña incorrectos.',
  };
  return map[err.code] || 'Error: ' + err.message;
}

function initApp() {
  // Initialize Firebase first (without DB listener yet)
  try {
    if(!window.firebase || !firebase?.apps) { console.warn("Firebase no disponible"); bootWithoutAuth(); return; }
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    // Listen for auth state
    firebase.auth().onAuthStateChanged(user => {
      if(user) {
        CURRENT_USER = user;
        DB_PATH = "torneosApp/users/" + user.uid + "/data";
        // Load group config for this user from localStorage (keyed by uid)
        GROUP_CONFIG = JSON.parse(localStorage.getItem('goalmates_group_' + user.uid) || 'null');
        if(GROUP_CONFIG) {
          PLAYERS.length = 0;
          GROUP_CONFIG.players.forEach(p => PLAYERS.push(p));
          // Update ui defaults
          ui.selected = [...PLAYERS];
          if(!ui.hA) ui.hA = PLAYERS[0]||'';
          if(!ui.hB) ui.hB = PLAYERS[1]||'';
          // Restore app HTML and boot
          bootApp();
        } else {
          // Authenticated but no group yet — show setup
          showSetupScreen();
        }
      } else {
        // Not logged in
        showAuthScreen('');
      }
    });
  } catch(err) {
    console.warn("Firebase error:", err);
    bootWithoutAuth();
  }
}

function bootApp() {
  // Restore the full app HTML if it was replaced by auth/setup screen
  if(!document.querySelector('.app')) {
    location.reload();
    return;
  }
  // Update header title
  const titleEl = document.getElementById('app-title');
  if(titleEl && GROUP_CONFIG) titleEl.textContent = GROUP_CONFIG.groupName || 'GoalMates';
  initFirebase();
  render();
}

function bootWithoutAuth() {
  GROUP_CONFIG = JSON.parse(localStorage.getItem('goalmates_group_config') || 'null');
  if(GROUP_CONFIG) {
    PLAYERS.length = 0;
    GROUP_CONFIG.players.forEach(p => PLAYERS.push(p));
    ui.selected = [...PLAYERS];
    if(!ui.hA) ui.hA = PLAYERS[0]||'';
    if(!ui.hB) ui.hB = PLAYERS[1]||'';
    bootApp();
  } else {
    showSetupScreen();
  }
}

function doSignOut() {
  if(!confirm('¿Cerrar sesión?')) return;
  firebase.auth().signOut().then(() => { location.reload(); });
}

function addPlayerInput() {
  const list = document.getElementById('setup-players-list');
  if (!list) return;
  const inputs = list.querySelectorAll('input');
  if (inputs.length >= 12) return;
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:8px;align-items:center;';
  div.innerHTML = `<input type="text" placeholder="Nombre jugador ${inputs.length+1}" maxlength="20"
    style="flex:1;border:2px solid #d1fae5;border-radius:12px;padding:10px;font-size:14px;font-weight:600;color:#0f172a;background:#f0fdf4;outline:none;">
    <button onclick="this.parentElement.remove()" style="background:#fee2e2;border:none;border-radius:10px;padding:8px 10px;color:#dc2626;cursor:pointer;font-size:16px;">✕</button>`;
  list.appendChild(div);
}

function createGroup() {
  const groupName = (document.getElementById('setup-groupname')?.value||'').trim() || 'Mi Grupo';
  const inputs = document.querySelectorAll('#setup-players-list input');
  const players = Array.from(inputs).map(i=>i.value.trim()).filter(Boolean);
  if (players.length < 2) { alert('Agregá al menos 2 jugadores'); return; }
  const groupId = 'g_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
  const config = {groupId, groupName, players, createdAt: new Date().toISOString()};
  if(window.firebase && firebase.auth && firebase.auth().currentUser) {
    localStorage.setItem('goalmates_group_' + firebase.auth().currentUser.uid, JSON.stringify(config));
  } else {
    localStorage.setItem('goalmates_group_config', JSON.stringify(config));
  }
  location.reload();
}

function resetGroup() {
  if(confirm('¿Resetear configuración del grupo? Se perderán todos los datos locales.')) {
    localStorage.clear();
    location.reload();
  }
}
